name: IDCOLDA signed Android release
on:
  push:
    branches: [feature/idcolda-native-android]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'setup-android.sh'
      - '.github/workflows/signed-android-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: idcolda-signed-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/feature/idcolda-native-android'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Validate Flutter source
        run: bash setup-android.sh
      - name: Prepare release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.IDCOLDA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.IDCOLDA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.IDCOLDA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.IDCOLDA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::warning::Release signing secrets are not configured; validation ran but no signed APK will be built."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/idcolda-release.jks"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Build signed universal APK
        if: steps.signing.outputs.ready == 'true'
        env:
          IDCOLDA_KEYSTORE: ${{ runner.temp }}/idcolda-release.jks
          IDCOLDA_STORE_PASSWORD: ${{ secrets.IDCOLDA_STORE_PASSWORD }}
          IDCOLDA_KEY_ALIAS: ${{ secrets.IDCOLDA_KEY_ALIAS }}
          IDCOLDA_KEY_PASSWORD: ${{ secrets.IDCOLDA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          version_name=$(sed -n 's/^version: \([^+]*\)+.*/\1/p' pubspec.yaml)
          version_code=$((10000 + GITHUB_RUN_NUMBER))
          test -n "$version_name"
          flutter build apk --release --build-name "$version_name" --build-number "$version_code"
          apk=build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          mkdir -p release
          cp "$apk" "release/IDCOLDA-$version_code.apk"
          cd release
          sha256sum "IDCOLDA-$version_code.apk" > SHA256SUMS.txt
      - name: Store signed APK for administrator review
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: IDCOLDA-signed-APK-${{ github.run_number }}
          path: release/
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/idcolda-release.jks"
