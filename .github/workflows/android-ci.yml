name: Android debug verification
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true
      - run: bash setup-android.sh --build-debug
      - uses: actions/upload-artifact@v4
        with:
          name: idcolda-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
