name: Android debug verification
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true
      - name: Configure Android SDK and Java
        run: bash Scripts/setup-ci-android-sdk.sh
      - run: flutter doctor -v
      - run: bash setup-android.sh --build-debug
      - uses: actions/upload-artifact@v4
        with:
          name: idcolda-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
