name: idcolda
description: IDCOLDA Solar Distribution Android client
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get: 4.7.3
  http: ^1.3.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  file_picker: 11.0.3
  url_launcher: ^6.3.1
  camera: 0.11.3+1
  google_mlkit_text_recognition: 0.15.0
  google_mlkit_barcode_scanning: 0.14.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/routes.json
    - assets/solar_network.png
    - assets/idcolda_logo.webp
